services:
  app:
    build: ./backend
    image: garmin-lifetime-analyzer:latest
    # Reachable only from this computer. Hosting later adds a reverse proxy with HTTPS and a login.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./import:/import:ro
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # Runs the Garmin sync once a day at GLA_SYNC_TIME, retrying a failed run up to three times.
  worker:
    build: ./backend
    image: garmin-lifetime-analyzer:latest
    command: ["gla", "worker"]
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
