[project]
name = "gla"
version = "1.0.0"
description = "Garmin Lifetime Analyzer: lifetime analysis of your own Garmin history"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "fitparse==1.2.0",
    "garmin-connect-personal-api-python>=1.0,<2",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fit-tool>=0.9.13",
]

[project.scripts]
gla = "gla.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fitparse.*"]
